[package]
name = "cosmic-external-osd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
tokio = { version = "1.52.1", features = ["time"] }
tracing = "0.1"
zbus = { version = "5.14", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "430f3d48a97d8779f9c1985473912e594ccca1ae"
default-features = false
features = ["tokio", "wayland", "multi-window", "winit"]
